name: Build extension ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Prepare extension files
        run: |
          mkdir -p "$RUNNER_TEMP/klpf"
          cp -R manifest.json background.js scripts.config.js background docs features gas icon offscreen setting templates vendor LICENSE README.md "$RUNNER_TEMP/klpf/"
      - name: Upload extension ZIP
        uses: actions/upload-artifact@v4
        with:
          name: KLPF-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/klpf/
          if-no-files-found: error
